## Configuração do radar. Tudo aqui está comentado: são os padrões do código.
## Para mudar um valor, tire o "# " da linha (ou ponha o valor em config.local.toml,
## que não vai para o repositório e vale por cima deste arquivo).
## Linhas "## ..." são texto; linhas "# chave = valor" são os padrões.
##
## O merge é raso por seção: [rede] com só "tentativas" mantém o resto da seção.
## Já [rede.limites] substitui o dicionário inteiro (o "*" volta a 1.0 se faltar).
## [rede.timeouts] soma ao padrão: listar outro host não tira o do Wayback.

## Onde ficam as execuções. Caminho relativo vale a partir da pasta radar/. Para a calibração no modo cego com o
## Claude Code (que lê os arquivos do projeto aberto), use uma pasta fora do projeto, em config.local.toml.
# casos_dir = "../casos"

[rede]
## proxy: vazio por padrão. Exemplo (Tor): proxy = "socks5://127.0.0.1:9050"
## ua_navegador: o User-Agent da Rede quando ela busca uma página como navegador (arquivar_fonte); a captura usa
## o UA nativo do Chromium, coerente com o sec-ch-ua.
# ua_navegador = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
## ua_api: com proxy configurado, o padrão abaixo vira "radar/0.1" (sem identificar o analista); um valor
## escolhido aqui vale sempre.
# ua_api = "ponzi-radar/0.1 (pesquisa; github.com/FFloriani/ponzi-radar)"
# timeout_s = 30.0
# tentativas = 4

## Segundos mínimos entre requisições por host. "*" vale para os hosts não listados.
# [rede.limites]
# "*" = 1.0
# "web.archive.org" = 2.0
# "archive.org" = 2.0
# "crt.sh" = 3.0
## O DoH (cloudflare-dns.com) é feito para muitas consultas: o nó dns faz 5 a 7 delas em série.
# "cloudflare-dns.com" = 0.2

## Timeout, em segundos, por host. O host que não está aqui usa timeout_s.
## O Wayback é lento: a listagem do CDX de um domínio grande passa de 70 s.
# [rede.timeouts]
# "web.archive.org" = 120.0

[captura]
# max_subpaginas = 10
# timeout_pagina_s = 30.0
# networkidle_s = 10.0

[indices]
## Validade, em horas, dos índices baixados (CVM, BCB).
# ttl_horas = 24
